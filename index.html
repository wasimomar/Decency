<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved language/direction before first paint to avoid a flash of RTL.
      try {
        if (localStorage.getItem('decency_lang') === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/logo/logo-transparent.png" />
    <link rel="apple-touch-icon" href="/logo/logo-transparent.png" />

    <meta name="theme-color" content="#F7F4EE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
